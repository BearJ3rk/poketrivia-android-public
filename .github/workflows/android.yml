name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent app signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore
      - name: Test and build installable APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh ./gradlew testDebugUnitTest assembleRelease
      - name: Test pull request build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: sh ./gradlew testDebugUnitTest assembleDebug
      - name: Name APK
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cp app/build/outputs/apk/release/app-release.apk PokeTrivia.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk PokeTrivia.apk
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeTrivia-${{ github.run_number }}
          path: PokeTrivia.apk
      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PokeTrivia.apk
          generate_release_notes: true
